name: Deploy BLACKWIRE to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate application
        run: npm test
      - name: Build static assets
        run: npm run build
      - name: Prepare Debian disk blocks
        shell: bash
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/debian-mini.ext2" https://github.com/leaningtech/webvm/releases/download/ext2_image/debian_mini_20230519_5022088024.ext2
          node scripts/prepare-disk.mjs "$RUNNER_TEMP/debian-mini.ext2" dist/images/debian-mini.ext2
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
